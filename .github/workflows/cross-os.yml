name: Cross-OS Verify

# Plan 103 — consolidated cross-OS + mobile-viewport smoke.
#
# Why this workflow exists: GitHub Actions cost reduction. The per-release
# cross-OS matrix in release.yml billed ~46 minutes per release tag (macOS
# bills at a 10× multiplier on a <4-min job), scaling with release cadence;
# the per-PR E2E Mobile workflow billed ~2 min on EVERY PR push while being
# non-blocking (continue-on-error). Both are now folded here and fired on a
# WEEKLY cron + on-demand via workflow_dispatch instead of per-release /
# per-PR.
#
# Plan 215 — release tags now run their OWN complete cross-OS + mobile battery
# in release.yml (publish is gated on macOS + Windows + Ubuntu-full + mobile
# e2e), so cross-OS coverage for a release is automatic. This workflow is no
# longer the pre-release manual step; it's the between-releases pulse — a weekly
# cron catches cross-OS / mobile regressions on `main`, and the manual dispatch
# stays for ad-hoc / high-risk checks off a release boundary.
# See docs/features/103-ci-cost-reduction.md and 215-ci-label-gated-verify.md.

on:
  workflow_dispatch:
  schedule:
    # Twice weekly (was once) — see docs/superpowers/specs/2026-07-06-verify-
    # ci-rebalance-design.md §5: once local pre-push stops running a full
    # Windows/Pester/macOS-equivalent pass on every push, this cron becomes
    # the only regular cross-platform coverage, so the cadence doubles.
    - cron: '0 2 * * 3' # Wednesday 02:00 UTC
    - cron: '0 2 * * 0' # Sunday 02:00 UTC — well clear of weekday PR contention

permissions:
  contents: read

# A manual fire while a cron run is in flight supersedes it (and vice versa).
concurrency:
  group: cross-os-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS + Windows verify smoke. Ubuntu is intentionally omitted — it runs
  # on every PR via verify.yml, so re-running it here would just burn minutes.
  cross-os-verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Node 24 + npm/node_modules caches + `npm ci` (root + server). Shared
      # composite with verify.yml (plan 106) — this matrix job gains the
      # node_modules cache as a bonus over the prior two bare `npm ci` calls.
      - name: Setup Node + deps
        uses: ./.github/actions/setup

      # ffmpeg gates the server MP3-encoder tests (server/src/tts/mp3.ts
      # shells out to it). GitHub runners don't ship it pre-installed.
      - name: Install ffmpeg (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install ffmpeg

      # choco's own exit code is not a reliable success signal: it can report
      # success (exit 0) while having installed 0/0 packages (observed: a 504
      # from the community Chocolatey feed), silently handing a broken
      # environment to a later step. Verify ffmpeg actually runs afterward
      # and retry a bounded number of times for the transient-feed case. A
      # bounded retry alone does not survive a feed OUTAGE (minutes/hours,
      # not seconds), so each attempt also falls back to `winget` when choco
      # leaves ffmpeg unrunnable. `winget` specifically, not a third-party
      # setup-ffmpeg action or a pinned static-build URL: this repo installs
      # native tooling with native package managers everywhere else (brew on
      # macOS, apt-get on Ubuntu) and avoids third-party actions, and
      # scripts/preflight-ffmpeg.cjs already tells developers to
      # `winget install Gyan.FFmpeg` -- so this reuses the repo's own
      # documented instruction rather than introducing a new one.
      - name: Install ffmpeg (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            choco install ffmpeg -y --no-progress
            $ffmpegOk = $false
            try {
              & ffmpeg -version | Out-Null
              $ffmpegOk = ($LASTEXITCODE -eq 0)
            } catch {
              $ffmpegOk = $false
            }

            if (-not $ffmpegOk) {
              Write-Host "Attempt $attempt/${maxAttempts}: choco reported success but ffmpeg is not runnable (a transient Chocolatey feed error is the likely cause -- see the choco output above). Trying the winget fallback."
              if (Get-Command winget -ErrorAction SilentlyContinue) {
                try {
                  winget install --id Gyan.FFmpeg --exact --source winget --accept-source-agreements --accept-package-agreements --disable-interactivity
                  # winget updates the registry PATH at install time, but this
                  # already-running process keeps the PATH it inherited at
                  # startup (the same trap scripts/preflight-ffmpeg.cjs
                  # documents for developer shells) -- re-read Machine + User
                  # PATH from the registry so `ffmpeg` resolves without
                  # needing a new process.
                  $env:Path = [System.Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path', 'User')
                  & ffmpeg -version | Out-Null
                  $ffmpegOk = ($LASTEXITCODE -eq 0)
                } catch {
                  Write-Host "winget fallback unavailable: $_"
                  $ffmpegOk = $false
                }

                # The re-read above only fixes PATH for *this* step's
                # process. Every later step (Verify, Build, ...) is a fresh
                # process spawned by the runner service, which still
                # carries the PATH it had at job start -- so without this,
                # ffmpeg resolves here but goes missing again by the time
                # `npm run verify:quick` runs `pretest`'s ffmpeg preflight
                # (observed 2026-08-19, cross-os run 32209846581).
                # $GITHUB_PATH is the documented mechanism for a step to
                # prepend a directory onto PATH for the rest of the job.
                # winget's Gyan.FFmpeg package places its shim here -- the
                # exact path observed in the real CI failure this fixes
                # (cross-os run 32209846581,
                # C:\Users\runneradmin\AppData\Local\Microsoft\WinGet\Links\ffmpeg.exe).
                # Deliberately its OWN try/catch, outside the one above: a
                # failure persisting this bookkeeping entry must never
                # retract an ffmpeg install that actually verified working,
                # nor fail the whole install silently -- it can only warn.
                # `-ErrorAction Stop` forces Add-Content's own failures to be
                # catchable here (its default is a non-terminating error,
                # which a bare try/catch does not observe at all). Gated on
                # $env:GITHUB_PATH: absent outside GitHub Actions (a local
                # shell, or scripts/tests/cross-os-ffmpeg-install.test.mjs's
                # parser/parse-only checks), where there is nothing to
                # persist to. $env:LOCALAPPDATA is checked separately, NOT
                # folded into this same condition -- this step only runs on
                # windows-latest, where it is always present for a real job,
                # but a silent skip on the rare box where it genuinely isn't
                # would recreate #2478 downstream with zero signal. The
                # regression test deliberately unsets LOCALAPPDATA (mirrors
                # ubuntu-latest's Hooks-tests leg, which also executes this
                # script) specifically to pin that the missing case warns
                # rather than skips quietly.
                if ($ffmpegOk -and $env:GITHUB_PATH) {
                  if ($env:LOCALAPPDATA) {
                    try {
                      $ffmpegDir = Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links'
                      Add-Content -Path $env:GITHUB_PATH -Value $ffmpegDir -ErrorAction Stop
                    } catch {
                      Write-Host "::warning::failed to persist ffmpeg's install directory to `$GITHUB_PATH for later steps -- later steps in this job may not find ffmpeg on PATH: $_"
                    }
                  } else {
                    Write-Host "::warning::LOCALAPPDATA is not set -- cannot determine the winget-installed ffmpeg directory to persist to `$GITHUB_PATH; later steps in this job may not find ffmpeg on PATH."
                  }
                }
              } else {
                Write-Host "winget fallback unavailable: no winget command on this runner."
              }
            }

            if ($ffmpegOk) {
              Write-Host "ffmpeg verified working (attempt $attempt/$maxAttempts)."
              exit 0
            }
            Write-Host "Attempt $attempt/${maxAttempts}: ffmpeg is still not runnable after choco and the winget fallback."
            if ($attempt -lt $maxAttempts) {
              Start-Sleep -Seconds 15
            }
          }
          Write-Error "CI: ffmpeg install failed after $maxAttempts attempts (choco + winget fallback) -- ffmpeg is not runnable on this runner. This is a CI runner, not a developer workstation: investigate the Chocolatey feed / winget source / this job's log rather than following a local-install hint."
          exit 1

      # macOS only aliases 127.0.0.1 on lo0 by default (unlike Linux/Windows,
      # which treat the whole 127.0.0.0/8 range as loopback out of the box).
      # server/src/lan-port-forwarder.ts binds its upstream connection's
      # localAddress to 127.0.0.2 (a deliberate security invariant, see that
      # file's comments) — without this alias the bind fails with
      # EADDRNOTAVAIL and lan-port-forwarder.test.ts fails/times out.
      - name: Alias 127.0.0.2 on loopback (macOS)
        if: matrix.os == 'macos-latest'
        run: sudo ifconfig lo0 alias 127.0.0.2 up

      # `verify:quick` is `test:all` (hooks + frontend + server + scripts +
      # sidecar). Sidecar tests skip with a banner when the venv isn't
      # bootstrapped (it won't be on a fresh runner — that's fine).
      - name: Verify
        run: npm run verify:quick

      - name: Build
        run: npm run build

  # Cheap (~seconds) probe gating mobile-e2e on the weekly cron (plan 106,
  # BACKLOG #39). Lists files changed on origin/main in the prior 7 days and
  # greps for the frontend/e2e path vocabulary (mirrors verify.yml's frontend +
  # e2e scopes plus the shared root package files). On a manual dispatch this
  # job still runs but mobile-e2e's `if:` short-circuits on the event name, so
  # a dispatch ALWAYS runs the mobile suite regardless of this output.
  changes:
    name: Detect frontend/e2e change window
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend_e2e: ${{ steps.probe.outputs.frontend_e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so `git log --since` can reach commits up to 7 days
          # back; a shallow clone would miss most of the window.
          fetch-depth: 0

      - name: Probe origin/main for frontend/e2e changes (last 7 days)
        id: probe
        run: |
          if git log --since='7 days ago' --name-only --pretty=format: origin/main \
            | sort -u \
            | grep -qE '^(src/|e2e/|index\.html$|vite\.config\.ts$|tailwind\.config\.ts$|playwright\.config\.ts$|package(-lock)?\.json$)'; then
            echo "frontend_e2e=true" >> "$GITHUB_OUTPUT"
            echo "frontend/e2e change detected on origin/main in the last 7 days → mobile-e2e WILL run"
          else
            echo "frontend_e2e=false" >> "$GITHUB_OUTPUT"
            echo "no frontend/e2e change on origin/main in the last 7 days → mobile-e2e will be skipped (unless manually dispatched)"
          fi

  # Mobile + tablet viewport e2e (Pixel 7 / iPad Pro 11), formerly the
  # per-PR e2e-mobile.yml. Ubuntu-only; chromium engine covers both viewport
  # presets per playwright.config.ts.
  #
  # Gated (plan 106 / #39): a manual workflow_dispatch ALWAYS runs it; the
  # weekly cron runs it only when `changes` saw a frontend/e2e change on
  # origin/main in the prior 7 days. cross-os-verify above is NOT gated — the
  # cross-OS smoke runs every cron/dispatch regardless of scope.
  mobile-e2e:
    name: npm run test:e2e:mobile
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Shared composite with verify.yml (plan 106): Node 24 + caches + ci.
      - name: Setup Node + deps
        uses: ./.github/actions/setup

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # No `continue-on-error` here (unlike the old per-PR e2e-mobile.yml):
      # this workflow fires on a weekly cron + on demand, so when it runs a
      # red mobile signal SHOULD fail loudly rather than being ignored.
      - name: E2E Mobile
        run: npm run test:e2e:mobile

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-mobile
          path: playwright-report/
          retention-days: 7
