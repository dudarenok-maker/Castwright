name: Verify

# Plan 60 — CI verify-on-PR. Plan 103 — per-PR cost reduction. Plan 215 — CI
# was opt-in (label-gated) while the repo was private and Actions minutes
# were metered. See docs/superpowers/specs/2026-07-06-verify-ci-rebalance-
# design.md: the repo is now public (free, uncapped Actions minutes on
# standard runners), and local `npm run verify` was causing multi-hour
# self-contention on the dev box, so this workflow flips from opt-in to
# OPT-OUT (runs on every PR by default) AND becomes a required status check
# on `main`'s branch-protection ruleset — closing the gap where local
# pre-push was previously the only thing that refused to push on a red leg.
#
# It runs only the LEGS whose scope actually changed (git diff against the PR
# base) — a PR that touches only `src/**` skips the server tests; a
# server-only PR skips the frontend unit suite + Playwright e2e; etc. Local
# pre-push now only runs a fast, branch-diff-scoped subset
# (`verify:fast:branch`) — this cloud run is the actual enforcement gate for
# everything else, not redundant insurance.
#
# JOB-PER-LEG, NOT ONE JOB (2026-07-10 — supersedes the single-job design):
# originally every leg ran as a sequential step inside one job, because
# GitHub used to bill each job's wall-clock separately, rounded UP to the
# minute, and N parallel jobs would each re-pay a `npm ci` + 1-min floor.
# Now that Actions minutes are free/uncapped on this public repo, that
# tradeoff flips: end-to-end PR latency (wall-clock to a green check) matters
# more than total minutes billed, and a sequential single job pays the SUM of
# every in-scope leg instead of the MAX. Split into independent jobs — each
# repeats checkout + `Setup Node + deps` (cheap: the composite's node_modules
# cache means most jobs skip `npm ci` entirely on a warm hit) — so
# lint/typecheck, frontend tests, server tests, e2e, e2e-visual, and build
# all run concurrently; end-to-end time collapses to roughly the slowest
# single leg instead of their sum.
#
# E2E ITSELF IS SHARDED (2026-07-10): a live timing comparison showed the
# functional e2e battery (~110 spec files, CI-pinned to workers=1 to avoid
# in-job Vite dev-server contention) was the dominant leg at ~16 min, dwarfing
# every other job. `--shard=N/4` splits it across 4 matrix jobs, each its own
# runner/dev-server — the workers=1 anti-flake guarantee still holds PER
# SHARD, just with 4x less work per shard. Visual baselines were pulled into
# their own job in the same change: they used to run as a serial step after
# test:e2e in the same job specifically to avoid racing test:e2e's dev server
# — moot once e2e lives in separate shard jobs, so visual now runs concurrently
# with every shard instead of waiting on them.
#
# `detect` runs once and fans its scope booleans out via `needs:`/`outputs:`
# to every other job's step-level `if:` — same per-leg scoping as before,
# just consumed across jobs instead of within one.
#
# The trailing `verify` job (needs: every leg job, `if: always()`) is a thin
# aggregator that exists ONLY to keep the "npm run verify" status-check name
# stable — that name is wired into `main`'s required-status-check ruleset,
# and renaming/removing it would silently detach the gate. The actual work
# happens in the named leg jobs above it; the aggregator just fails if any of
# them failed or was cancelled.
#
# No `paths-ignore` here (deliberately removed — see design spec): keeping it
# while this is a required status check would deadlock every docs-only PR,
# since a required check that never fires blocks merge forever. Every leg's
# own `if:` scope condition already evaluates false for a docs-only diff, so
# every job still completes in roughly the time of "Setup Node + deps" alone
# and the aggregator reports green — no deadlock, negligible added time. Same
# reasoning is why no job gates on PR `draft` status either — a draft-gated
# required check would deadlock every draft PR the same way.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  # Manual on-demand run: Actions tab → Verify → Run workflow, or
  # `gh workflow run verify.yml --ref <branch>`. A dispatch has no PR diff to
  # scope against, so it runs the FULL battery (every leg) — see the scope
  # detector below.
  workflow_dispatch:

permissions:
  contents: read

# Cancel an in-flight run when the PR is updated; the new commit's run
# supersedes any prior one for the same PR. Applies workflow-wide — every job
# in a superseded run is cancelled, not just one leg.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which scopes the PR touched by diffing the merge base against the
  # PR head, then derive per-step scope via scripts/ci-scope.mjs (the same
  # STEPS[] map npm run verify's local caching uses) — bash + git for the
  # diff, no third-party action, matching this repo's all-first-party
  # (actions/*) convention. Output is a single scopes JSON blob consumed via
  # fromJSON() on every leg job/step below.
  detect:
    name: Detect changed scopes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # ONE json blob rather than one output per step: GitHub has no wildcard
      # for this map, so per-step outputs would be a third artifact that can
      # silently drift from the emitted keys. Consumed via fromJSON below.
      scopes: ${{ steps.changes.outputs.scopes }}
      # Sentinel: proves ci-scope.mjs actually ran and wrote. The aggregator
      # asserts this, catching the case where detect SUCCEEDS having written
      # nothing — every `if:` false, every job green, required check green
      # having run nothing.
      ok: ${{ steps.changes.outputs.ok }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so the scope detector can diff the PR head against
          # its base commit. A shallow clone wouldn't have the base reachable.
          fetch-depth: 0

      - name: Setup Node + deps
        uses: ./.github/actions/setup

      - name: Detect changed scopes
        id: changes
        run: |
          # A manual dispatch has no PR base/head to diff against. Leave FILES
          # empty and let ci-scope.mjs branch on GITHUB_EVENT_NAME — it emits
          # all-true for a dispatch, matching the old bash early-exit.
          FILES=""
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            # Merge-base, not BASE itself: a PR branch created from a stale
            # main would otherwise treat every file main moved past the fork
            # point as "changed in this PR".
            MERGE_BASE="$(git merge-base "$BASE" "$HEAD" 2>/dev/null || echo "$BASE")"
            FILES="$(git diff --name-only "$MERGE_BASE" "$HEAD")"
          fi
          echo "Changed files in this PR:"
          echo "$FILES"
          echo "---"
          node scripts/ci-scope.mjs --files="$FILES" >> "$GITHUB_OUTPUT"
          echo "--- derived scope ---"
          node scripts/ci-scope.mjs --files="$FILES"

  lint-and-checks:
    name: Lint, typecheck & fast checks
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node + deps
        uses: ./.github/actions/setup

      # Lint (was: frontend || server || scripts || shared)
      # leg: lint
      - name: Lint
        if: fromJSON(needs.detect.outputs.scopes).step_lint || fromJSON(needs.detect.outputs.scopes).shared
        run: npm run lint

      # Typecheck (was: frontend || server || shared)
      # leg: typecheck
      - name: Typecheck
        if: fromJSON(needs.detect.outputs.scopes).step_typecheck || fromJSON(needs.detect.outputs.scopes).shared
        run: npm run typecheck

      # Drift guard: fails if server/.env.example is out of sync with the
      # config registry. Previously ONLY ran via local `npm run verify` — see
      # docs/superpowers/specs/2026-07-06-verify-ci-rebalance-design.md §3.
      # Config check (was: server || shared)
      # leg: config:check
      - name: Config check
        if: fromJSON(needs.detect.outputs.scopes).step_config_check || fromJSON(needs.detect.outputs.scopes).shared
        run: npm run config:check

      # Drift guard, sibling to the one above: src/lib/api-types.ts is
      # GENERATED from openapi.yaml and is committed, and openapi-typescript
      # emits each schema `description` into it as JSDoc. So an openapi edit
      # that skips `npm run openapi:types` ships a generated artifact whose
      # prose contradicts its own source — which is exactly what happened on
      # this PR, undetected, because nothing gated codegen drift. Gated on
      # `openapi` explicitly (its dedicated CI_ONLY key) and on `step_test`
      # too — its glob is src/**, so a hand-edit of the generated file is
      # caught the same way (was: openapi || frontend || shared).
      # leg: openapi:types
      - name: OpenAPI types up to date
        if: fromJSON(needs.detect.outputs.scopes).openapi || fromJSON(needs.detect.outputs.scopes).step_test || fromJSON(needs.detect.outputs.scopes).shared
        run: |
          npm run openapi:types
          git diff --exit-code -- src/lib/api-types.ts || {
            echo "::error::src/lib/api-types.ts is stale. Run 'npm run openapi:types' and commit the result."
            exit 1
          }

      # Hooks tests (was: hooks || scripts || shared)
      # leg: test:hooks
      - name: Hooks tests
        if: fromJSON(needs.detect.outputs.scopes).step_test_hooks || fromJSON(needs.detect.outputs.scopes).shared
        run: npm run test:hooks

      # No-ops with a banner on a runner without Pester 5 (the GitHub
      # ubuntu image ships pwsh but not Pester 5), exactly as the old
      # `npm run verify` leg did. Kept gated on `test:scripts` so it provides
      # real coverage if/when Pester 5 is bootstrapped on the runner.
      # Deliberate coverage WIDENING (was: scripts, with no `shared` disjunct
      # at all): a root package-lock.json diff touches zero steps via
      # stepTouchedByDiff, so `shared` is the only thing that would catch a
      # dependency bump here — added per the branch's Global Constraint that
      # `shared` stays a disjunct on every derived condition. After this, a
      # lockfile-only diff also runs Pester, which it did not before.
      # leg: test:scripts
      - name: PowerShell-helper tests (Pester)
        if: fromJSON(needs.detect.outputs.scopes).step_test_scripts || fromJSON(needs.detect.outputs.scopes).shared
        run: npm run test:scripts

      # Previously ONLY ran via local `npm run verify` — see
      # docs/superpowers/specs/2026-07-06-verify-ci-rebalance-design.md §3.
      # Pinokio tests (was: pinokio || shared)
      # leg: test:pinokio
      - name: Pinokio tests
        if: fromJSON(needs.detect.outputs.scopes).step_test_pinokio || fromJSON(needs.detect.outputs.scopes).shared
        run: npm run test:pinokio

  frontend-tests:
    name: Frontend tests + a11y
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history: `vitest run --changed <base>` below needs the BASE
          # commit reachable in the local git object DB — a shallow (depth-1)
          # clone wouldn't have it, and `--changed` would fail to resolve it.
          fetch-depth: 0

      - name: Setup Node + deps
        uses: ./.github/actions/setup

      # `--changed <base>` narrows the frontend vitest run to only the tests
      # whose module graph touches this PR's diff (CI cost round 2). Reliable
      # here because tests are colocated and statically import their unit. A
      # change to src/test/setup.ts (runner-injected, NOT import-reachable)
      # forces a full run via forceRerunTriggers in vitest.config.ts; a root
      # dep/config bump (the `shared` scope) forces a full run via vitest's
      # default triggers. test:a11y stays always-on as a cheap core-view gate.
      # See docs/features/118-ci-cost-round-2.md.
      # test:e2e is a deliberate extra trigger: this step also runs
      # `npm run test:a11y`, which has no STEP of its own, and an e2e-only
      # diff should still exercise the a11y battery. Dropping it would be a
      # silent narrowing of what runs today. openapi.yaml needs no special
      # handling: it is already in `test`'s extraFiles, so `step_test` covers
      # it (was: frontend || e2e || shared || openapi).
      # leg: test
      - name: Frontend tests + a11y
        if: fromJSON(needs.detect.outputs.scopes).step_test || fromJSON(needs.detect.outputs.scopes).step_test_e2e || fromJSON(needs.detect.outputs.scopes).shared
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          # On a manual dispatch BASE is empty (no PR) → run the full suite.
          if [ -n "$BASE" ]; then npx vitest run --changed "$BASE"; else npx vitest run; fi
          npm run test:a11y

  server-tests:
    name: Server tests (fast + slow)
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history: `vitest run --changed <base>` below needs the BASE
          # commit reachable in the local git object DB — a shallow (depth-1)
          # clone wouldn't have it, and `--changed` would fail to resolve it.
          fetch-depth: 0

      - name: Setup Node + deps
        uses: ./.github/actions/setup

      # ffmpeg is needed by the server MP3 encoder (server/src/tts/mp3.ts
      # shells out to it). Install it only when this job's leg will run.
      # supports: test:server
      - name: Install ffmpeg
        if: fromJSON(needs.detect.outputs.scopes).step_test_server || fromJSON(needs.detect.outputs.scopes).step_test_server_slow || fromJSON(needs.detect.outputs.scopes).shared
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # `--changed <base>` narrows both server configs to diff-affected tests
      # (CI cost round 2). The slow config still serial-runs ONLY the hot files
      # the diff actually touched. Run from server/ so the per-dir vitest
      # config loads. A sidecar-only PR touches no server TS graph → 0 tests
      # run here, which is correct (server tests mock the Python sidecar).
      # See docs/features/118-ci-cost-round-2.md.
      # test:server AND test:server-slow share this one step, so the
      # condition is the union of both steps' keys. Drops the old `sidecar`
      # disjunct deliberately: a sidecar-only diff used to run this job for
      # zero tests (server tests mock the Python sidecar, per the comment
      # above), so skipping the job entirely for that diff is behaviour-
      # neutral, not a narrowing (was: server || sidecar || shared).
      # leg: test:server
      - name: Server tests (fast + slow)
        if: fromJSON(needs.detect.outputs.scopes).step_test_server || fromJSON(needs.detect.outputs.scopes).step_test_server_slow || fromJSON(needs.detect.outputs.scopes).shared
        run: |
          cd server
          BASE="${{ github.event.pull_request.base.sha }}"
          # On a manual dispatch BASE is empty (no PR) → run the full suite.
          if [ -n "$BASE" ]; then
            npx vitest run --changed "$BASE"
            npx vitest run --config vitest.config.slow.ts --changed "$BASE"
          else
            npx vitest run
            npx vitest run --config vitest.config.slow.ts
          fi

  sidecar-tests:
    name: Sidecar tests (pytest)
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Every other job uses this; without it this job relies on whatever Node
      # ubuntu-latest happens to ship and pins no version. `npm run
      # test:sidecar` needs Node but no node_modules, so the composite's
      # `npm ci` is cheap insurance rather than a requirement.
      - name: Setup Node + deps
        uses: ./.github/actions/setup

      # supports: test:sidecar
      - name: Setup Python
        if: fromJSON(needs.detect.outputs.scopes).step_test_sidecar || fromJSON(needs.detect.outputs.scopes).shared
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # The LEAN dependency set only: requirements/base.txt is vendor-neutral
      # (fastapi/uvicorn/numpy/psutil) and requirements-dev.txt is pytest +
      # httpx. The heavy ML stack (torch, coqui-tts, speechbrain) lives in the
      # vendor overlay and speaker-qa.txt and is deliberately NOT installed —
      # tests needing it use pytest.importorskip and report as skipped.
      # supports: test:sidecar
      - name: Bootstrap sidecar venv
        if: fromJSON(needs.detect.outputs.scopes).step_test_sidecar || fromJSON(needs.detect.outputs.scopes).shared
        run: |
          cd server/tts-sidecar
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements/base.txt -r requirements-dev.txt

      # --require-venv turns "no venv" from a SKIP into a hard failure: on CI a
      # missing venv means the bootstrap above broke. Without it this leg would
      # be vacuously green, which is worse than the hole it closes (#2119
      # review, defect C).
      # Sidecar tests (was: sidecar || shared)
      # leg: test:sidecar
      - name: Sidecar tests
        if: fromJSON(needs.detect.outputs.scopes).step_test_sidecar || fromJSON(needs.detect.outputs.scopes).shared
        run: npm run test:sidecar -- --require-venv

  # E2E functional battery (~110 spec files) is the long pole of the whole
  # workflow — CI intentionally pins Playwright to `workers: 1` (playwright.
  # config.ts) so parallel Chromium instances can't thundering-herd the
  # single Vite dev server WITHIN one job. That constraint is per-job, not
  # global: `--shard=N/4` below splits the spec list across 4 independent
  # matrix jobs, each on its own runner with its own dev server (no shared
  # process to contend over), while every shard still runs serially inside
  # itself — same anti-flake guarantee, ~4x less wall-clock.
  e2e:
    name: E2E (chromium) — shard ${{ matrix.shard }}/4
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node + deps
        uses: ./.github/actions/setup

      # ffmpeg is needed by the e2e suite's audio paths.
      # supports: test:e2e
      - name: Install ffmpeg
        if: fromJSON(needs.detect.outputs.scopes).step_test_e2e || fromJSON(needs.detect.outputs.scopes).shared
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # supports: test:e2e
      - name: Cache Playwright browsers
        if: fromJSON(needs.detect.outputs.scopes).step_test_e2e || fromJSON(needs.detect.outputs.scopes).shared
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # supports: test:e2e
      - name: Install Playwright chromium
        if: (fromJSON(needs.detect.outputs.scopes).step_test_e2e || fromJSON(needs.detect.outputs.scopes).shared) && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # E2E (chromium) (was: frontend || e2e || shared) — no separate
      # `frontend` disjunct needed: test:e2e's own glob already includes
      # src/**, so step_test_e2e alone covers a frontend-only diff too.
      # leg: test:e2e
      - name: E2E (chromium)
        if: fromJSON(needs.detect.outputs.scopes).step_test_e2e || fromJSON(needs.detect.outputs.scopes).shared
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4

  # Visual snapshots split out from the functional battery above (2026-07-10)
  # — they were previously a serial step in the same job so they couldn't
  # race test:e2e's workers for the Vite dev server; now that each e2e shard
  # already gets its own isolated job/runner, that constraint is moot, and
  # giving visual baselines their own job lets them run concurrently with
  # every e2e shard instead of waiting for the (now sharded, still slower)
  # functional battery to finish first. Stays `workers=1` for itself — this
  # mirrors the local `verify` (verify-cache.mjs). CI is Ubuntu, so this
  # validates the committed `e2e/linux/**` baselines; without it, visual
  # regressions slip past every PR and only surface at release time
  # (release.yml runs the full `npm run verify`, which includes this leg, on
  # Ubuntu).
  e2e-visual:
    name: E2E visual baselines (chromium)
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node + deps
        uses: ./.github/actions/setup

      # ffmpeg is needed by the e2e suite's audio paths.
      # supports: test:e2e:visual
      - name: Install ffmpeg
        if: fromJSON(needs.detect.outputs.scopes).step_test_e2e_visual || fromJSON(needs.detect.outputs.scopes).shared
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # supports: test:e2e:visual
      - name: Cache Playwright browsers
        if: fromJSON(needs.detect.outputs.scopes).step_test_e2e_visual || fromJSON(needs.detect.outputs.scopes).shared
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # supports: test:e2e:visual
      - name: Install Playwright chromium
        if: (fromJSON(needs.detect.outputs.scopes).step_test_e2e_visual || fromJSON(needs.detect.outputs.scopes).shared) && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # E2E visual baselines (chromium) (was: frontend || e2e || shared) — same
      # reasoning as the functional E2E leg: test:e2e:visual's own glob already
      # includes src/**, so no separate `frontend` disjunct is needed. Its
      # STEPS definition is byte-identical to test:e2e's today, so the two
      # keys are guaranteed to agree for any given diff — kept as its own key
      # (rather than reusing step_test_e2e) so the two legs can diverge
      # independently if either step's inputs.globs is ever narrowed on its own.
      # leg: test:e2e:visual
      - name: E2E visual baselines (chromium)
        if: fromJSON(needs.detect.outputs.scopes).step_test_e2e_visual || fromJSON(needs.detect.outputs.scopes).shared
        run: npm run test:e2e:visual

  build:
    name: Build
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node + deps
        uses: ./.github/actions/setup

      # Build (was: frontend || server || shared)
      # leg: build
      - name: Build
        if: fromJSON(needs.detect.outputs.scopes).step_build || fromJSON(needs.detect.outputs.scopes).shared
        run: npm run build

  # Thin aggregator — see the top-of-file comment. Keeps the "npm run verify"
  # status-check name (required on main's branch-protection ruleset) stable
  # while the real work runs concurrently in the named jobs above.
  verify:
    name: npm run verify
    needs: [lint-and-checks, frontend-tests, server-tests, sidecar-tests, e2e, e2e-visual, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check leg results
        # Fails on 'failure' OR 'cancelled' OR 'skipped' — not just the first
        # two — so an upstream `detect` failure (which SKIPS every leg job
        # rather than failing it, since they `needs: detect`) still fails
        # this aggregator instead of silently reporting green.
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "One or more verify legs did not succeed:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi
          echo "All verify legs passed."
