# Composite action — the "Install ffmpeg (Windows)" step that was
# byte-duplicated across cross-os.yml and release.yml (#2480).
#
# choco's own exit code is not a reliable success signal: it can report
# success (exit 0) while having installed 0/0 packages (observed: a 504 from
# the community Chocolatey feed), silently handing a broken environment to a
# later step. This verifies ffmpeg actually runs afterward and retries a
# bounded number of times for the transient-feed case. A bounded retry alone
# does not survive a feed OUTAGE (minutes/hours, not seconds), so each
# attempt also falls back to `winget` when choco leaves ffmpeg unrunnable.
# `winget` specifically, not a third-party setup-ffmpeg action or a pinned
# static-build URL: this repo installs native tooling with native package
# managers everywhere else (brew on macOS, apt-get on Ubuntu) and avoids
# third-party actions, and scripts/preflight-ffmpeg.cjs already tells
# developers to `winget install Gyan.FFmpeg` -- so this reuses the repo's own
# documented instruction rather than introducing a new one.
#
# Deliberately NOT folded into .github/actions/setup/action.yml: that action
# is the OS-agnostic dependency-install preamble every job runs unconditionally;
# this is Windows-only and only two of its three call sites (cross-os.yml,
# release.yml) need it. The macOS/Ubuntu ffmpeg-install steps stay
# per-workflow and out of scope here for the same OS-specific reasons that
# action's own header documents for skipping ffmpeg entirely.
#
# See scripts/tests/cross-os-ffmpeg-install.test.mjs for the regression
# coverage (parser-level checks plus stubbed choco/winget/ffmpeg behavioural
# checks) that pins this script's control flow, including the PATH-persist
# trap and the LOCALAPPDATA-absent edge case documented inline below.
name: 'Install ffmpeg (Windows)'
description: 'Install ffmpeg via choco with a winget fallback and a bounded retry, verifying ffmpeg is actually runnable afterward.'

runs:
  using: 'composite'
  steps:
    - name: Install ffmpeg (Windows)
      shell: pwsh
      run: |
        $maxAttempts = 3
        for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
          choco install ffmpeg -y --no-progress
          $ffmpegOk = $false
          try {
            & ffmpeg -version | Out-Null
            $ffmpegOk = ($LASTEXITCODE -eq 0)
          } catch {
            $ffmpegOk = $false
          }

          if (-not $ffmpegOk) {
            Write-Host "Attempt $attempt/${maxAttempts}: choco reported success but ffmpeg is not runnable (a transient Chocolatey feed error is the likely cause -- see the choco output above). Trying the winget fallback."
            if (Get-Command winget -ErrorAction SilentlyContinue) {
              try {
                winget install --id Gyan.FFmpeg --exact --source winget --accept-source-agreements --accept-package-agreements --disable-interactivity
                # winget updates the registry PATH at install time, but this
                # already-running process keeps the PATH it inherited at
                # startup (the same trap scripts/preflight-ffmpeg.cjs
                # documents for developer shells) -- re-read Machine + User
                # PATH from the registry so `ffmpeg` resolves without
                # needing a new process.
                $env:Path = [System.Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path', 'User')
                & ffmpeg -version | Out-Null
                $ffmpegOk = ($LASTEXITCODE -eq 0)
              } catch {
                Write-Host "winget fallback unavailable: $_"
                $ffmpegOk = $false
              }

              # The re-read above only fixes PATH for *this* step's
              # process. Every later step (Verify, Build, ...) is a fresh
              # process spawned by the runner service, which still
              # carries the PATH it had at job start -- so without this,
              # ffmpeg resolves here but goes missing again by the time
              # `npm run verify:quick` runs `pretest`'s ffmpeg preflight
              # (observed 2026-08-19, cross-os run 32209846581).
              # $GITHUB_PATH is the documented mechanism for a step to
              # prepend a directory onto PATH for the rest of the job.
              # winget's Gyan.FFmpeg package places its shim here -- the
              # exact path observed in the real CI failure this fixes
              # (cross-os run 32209846581,
              # C:\Users\runneradmin\AppData\Local\Microsoft\WinGet\Links\ffmpeg.exe).
              # Deliberately its OWN try/catch, outside the one above: a
              # failure persisting this bookkeeping entry must never
              # retract an ffmpeg install that actually verified working,
              # nor fail the whole install silently -- it can only warn.
              # `-ErrorAction Stop` forces Add-Content's own failures to be
              # catchable here (its default is a non-terminating error,
              # which a bare try/catch does not observe at all). Gated on
              # $env:GITHUB_PATH: absent outside GitHub Actions (a local
              # shell, or scripts/tests/cross-os-ffmpeg-install.test.mjs's
              # parser/parse-only checks), where there is nothing to
              # persist to. $env:LOCALAPPDATA is checked separately, NOT
              # folded into this same condition -- this step only runs on
              # windows-latest, where it is always present for a real job,
              # but a silent skip on the rare box where it genuinely isn't
              # would recreate #2478 downstream with zero signal. The
              # regression test deliberately unsets LOCALAPPDATA (mirrors
              # ubuntu-latest's Hooks-tests leg, which also executes this
              # script) specifically to pin that the missing case warns
              # rather than skips quietly.
              if ($ffmpegOk -and $env:GITHUB_PATH) {
                if ($env:LOCALAPPDATA) {
                  try {
                    $ffmpegDir = Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links'
                    Add-Content -Path $env:GITHUB_PATH -Value $ffmpegDir -ErrorAction Stop
                  } catch {
                    Write-Host "::warning::failed to persist ffmpeg's install directory to `$GITHUB_PATH for later steps -- later steps in this job may not find ffmpeg on PATH: $_"
                  }
                } else {
                  Write-Host "::warning::LOCALAPPDATA is not set -- cannot determine the winget-installed ffmpeg directory to persist to `$GITHUB_PATH; later steps in this job may not find ffmpeg on PATH."
                }
              }
            } else {
              Write-Host "winget fallback unavailable: no winget command on this runner."
            }
          }

          if ($ffmpegOk) {
            Write-Host "ffmpeg verified working (attempt $attempt/$maxAttempts)."
            exit 0
          }
          Write-Host "Attempt $attempt/${maxAttempts}: ffmpeg is still not runnable after choco and the winget fallback."
          if ($attempt -lt $maxAttempts) {
            Start-Sleep -Seconds 15
          }
        }
        Write-Error "CI: ffmpeg install failed after $maxAttempts attempts (choco + winget fallback) -- ffmpeg is not runnable on this runner. This is a CI runner, not a developer workstation: investigate the Chocolatey feed / winget source / this job's log rather than following a local-install hint."
        exit 1
