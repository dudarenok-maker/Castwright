# Composite action — installs ffmpeg + ffprobe on an Ubuntu runner.
#
# History: #2449 replaced three byte-duplicated `apt-get install ffmpeg` steps
# with this action (cache the apt .debs, step-level timeout). #4453 then
# measured that on a cache MISS the apt path still hit its 180s ceiling
# (exit 124) in 7+ runs on 2026-11-18/19 — every red E2E / visual / Server
# leg of that round failed in `Install ffmpeg` before a test ran. Owner
# decision on #4453: on a cache miss, download a pinned, checksum-verified
# static build instead of running apt at all.
#
# Why this build: johnvansickle.com's VERSIONED archive
# (`ffmpeg-7.0.2-amd64-static.tar.xz`). Unlike its `-release-` alias (which
# moves) and unlike BtbN's dated autobuild tags (which the project prunes),
# a versioned file is immutable, so the pinned SHA-256 below stays valid. It
# is built with libmp3lame + libopus (what server/src/tts/mp3.ts and the
# Opus export need) and the `loudnorm` filter; libfdk_aac is absent, exactly
# as on Ubuntu's apt build, and the encoder already falls back to native
# `aac` (docs/features/archive/72-audio-codec-aac-opus.md). 7.0.2 satisfies
# package.json `castwright.ffmpeg.minimum` (6.0). It ships ffprobe too, which
# server/src/export/* shells out to.
#
# Bumping the build: change the URL, the SHA-256, the version in the cache
# key, and the matching constants in scripts/tests/workflow-wiring.test.mjs.
#
# No apt fallback, deliberately: apt IS the hang this replaces, and a
# fallback to it would only re-introduce a 6-minute worst case. A download
# failure or checksum mismatch is retried 3 times (each bounded by `timeout`),
# then fails the step loudly; nothing falls through to anything else.
#
# Cache: the extracted binaries are cached. The key carries the ffmpeg
# version, NOT the runner image — the old key embedded ImageOS/ImageVersion
# (apt .debs are image-coupled), so every runner-image roll missed. A static
# binary is image-independent. NOTE (#4453): verify.yml triggers on
# pull_request only, so its cache entries live in the PR's own ref scope and
# are unreadable by other PRs; main never writes one. A PR's first run
# therefore always misses — which is now a ~42 MB download, not an apt run.
#
# `timeout-minutes:` is not accepted on a composite action's own steps, so
# each download is wrapped in coreutils `timeout -k 10 90` instead.
name: 'Install ffmpeg (cached)'
description: 'Install ffmpeg and ffprobe on an Ubuntu runner from a pinned, SHA-256-verified static build, cached so a hit skips the download.'

inputs:
  ffmpeg-version-pin:
    description: 'Manual cache-invalidation override: bump to force a fresh download and cache write.'
    required: false
    default: 'v3'

runs:
  using: 'composite'
  steps:
    - name: Cache static ffmpeg
      id: ffmpeg-cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/ffmpeg-static
        key: ${{ runner.os }}-ffmpeg-static-7.0.2-${{ inputs.ffmpeg-version-pin }}

    - name: Install ffmpeg
      shell: bash
      run: |
        set -euo pipefail
        DEST="${{ runner.temp }}/ffmpeg-static"
        if [ "${{ steps.ffmpeg-cache.outputs.cache-hit }}" = "true" ]; then
          echo "ffmpeg cache hit: using $DEST, skipping download"
        else
          echo "ffmpeg cache miss: downloading pinned static build"
          TMP="$(mktemp -d)"
          # 3 attempts around download + verify: the first CI run of this
          # action (PR #4455) saw 2 of 10 parallel jobs get a body that
          # failed the checksum within ~350ms (not the real 42 MB archive)
          # while the other 8 were fine. A bad body is retried; a persistent
          # mismatch still fails the step, with what the server sent.
          OK=0
          for attempt in 1 2 3; do
            rm -f "$TMP/ffmpeg.tar.xz"
            if timeout -k 10 90 curl -fsSL --connect-timeout 20 --max-time 60 \
                -o "$TMP/ffmpeg.tar.xz" \
                "https://johnvansickle.com/ffmpeg/releases/ffmpeg-7.0.2-amd64-static.tar.xz" \
              && echo "abda8d77ce8309141f83ab8edf0596834087c52467f6badf376a6a2a4c87cf67  $TMP/ffmpeg.tar.xz" | sha256sum -c -; then
              OK=1
              break
            fi
            echo "::warning::ffmpeg download/verify attempt $attempt/3 failed"
            ls -l "$TMP/ffmpeg.tar.xz" || true
            head -c 400 "$TMP/ffmpeg.tar.xz" | od -c | head -12 || true
            sleep $((attempt * 3))
          done
          if [ "$OK" != "1" ]; then
            echo "::error::ffmpeg static build failed to download and verify after 3 attempts"
            exit 1
          fi
          mkdir -p "$DEST"
          tar -xJf "$TMP/ffmpeg.tar.xz" -C "$TMP"
          install -m 0755 "$TMP"/ffmpeg-7.0.2-amd64-static/ffmpeg "$TMP"/ffmpeg-7.0.2-amd64-static/ffprobe "$DEST/"
          rm -rf "$TMP"
        fi
        echo "$DEST" >> "$GITHUB_PATH"

    - name: Verify ffmpeg
      shell: bash
      run: |
        ffmpeg -version
        ffprobe -version | head -1
