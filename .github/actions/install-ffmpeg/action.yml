# Composite action — installs ffmpeg + ffprobe on an Ubuntu runner.
#
# History: #2449 replaced three byte-duplicated `apt-get install ffmpeg` steps
# with this action (cache the apt .debs, step-level timeout). #4453 then
# measured that on a cache MISS the apt path still hit its 180s ceiling
# (exit 124) in 7+ runs on 2026-11-18/19 — every red E2E / visual / Server
# leg of that round failed in `Install ffmpeg` before a test ran. Owner
# decision on #4453: on a cache miss, download a pinned, checksum-verified
# static build instead of running apt at all.
#
# Why this build: BtbN/FFmpeg-Builds, the `autobuild-2026-10-31-12-59`
# release (ffmpeg n8.1.3, linux64-gpl). Month-end autobuild tags are kept
# indefinitely by that project (the 2024-12-31 one still exists), unlike its
# daily tags, so the URL is stable; the asset is served from GitHub's own
# network, next to the runner. First attempt was johnvansickle.com's
# versioned 7.0.2 archive (immutable, SHA-256 abda8d77...), but PR #4455's
# first CI run showed it answering datacenter IPs with a 7 KB HTML page
# (bot challenge) for ~2 of 10 parallel jobs; retrying the same host is not a
# fix. This build has libmp3lame, libopus and the `loudnorm` filter (what
# server/src/tts/mp3.ts and the Opus export need); libfdk_aac is absent, as
# on Ubuntu's apt build, and the encoder already falls back to native `aac`
# (docs/features/archive/72-audio-codec-aac-opus.md). 8.1 is above
# package.json `castwright.ffmpeg.minimum` (6.0). It ships ffprobe too,
# which server/src/export/* shells out to.
#
# Bumping the build: change the URL, the SHA-256, the version in the cache
# key, and the matching constants in scripts/tests/workflow-wiring.test.mjs.
#
# No apt fallback, deliberately: apt IS the hang this replaces, and a
# fallback to it would only re-introduce a 6-minute worst case. A download
# failure or checksum mismatch is retried 3 times (each bounded by `timeout`),
# then fails the step loudly; nothing falls through to anything else.
#
# Cache: the extracted binaries are cached. The key carries the ffmpeg
# version (8.1.3), NOT the runner image — the old key embedded ImageOS/ImageVersion
# (apt .debs are image-coupled), so every runner-image roll missed. A static
# binary is image-independent. NOTE (#4453): verify.yml triggers on
# pull_request only, so its cache entries live in the PR's own ref scope and
# are unreadable by other PRs; main never writes one. A PR's first run
# therefore always misses — which is now a ~150 MB download from GitHub's network, not an apt run.
#
# `timeout-minutes:` is not accepted on a composite action's own steps, so
# each download is wrapped in coreutils `timeout -k 10 150` instead.
name: 'Install ffmpeg (cached)'
description: 'Install ffmpeg and ffprobe on an Ubuntu runner from a pinned, SHA-256-verified static build, cached so a hit skips the download.'

inputs:
  ffmpeg-version-pin:
    description: 'Manual cache-invalidation override: bump to force a fresh download and cache write.'
    required: false
    default: 'v4'

runs:
  using: 'composite'
  steps:
    - name: Cache static ffmpeg
      id: ffmpeg-cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/ffmpeg-static
        key: ${{ runner.os }}-ffmpeg-static-8.1.3-${{ inputs.ffmpeg-version-pin }}

    - name: Install ffmpeg
      shell: bash
      run: |
        set -euo pipefail
        DEST="${{ runner.temp }}/ffmpeg-static"
        if [ "${{ steps.ffmpeg-cache.outputs.cache-hit }}" = "true" ]; then
          echo "ffmpeg cache hit: using $DEST, skipping download"
        else
          echo "ffmpeg cache miss: downloading pinned static build"
          TMP="$(mktemp -d)"
          # 3 attempts around download + verify, so one bad body or dropped
          # connection does not fail the job; a persistent mismatch still
          # fails the step, with what the server sent.
          OK=0
          for attempt in 1 2 3; do
            rm -f "$TMP/ffmpeg.tar.xz"
            if timeout -k 10 150 curl -fsSL --connect-timeout 20 --max-time 120 \
                -o "$TMP/ffmpeg.tar.xz" \
                "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-31-12-59/ffmpeg-n8.1.3-27-g8dca1586f4-linux64-gpl-8.1.tar.xz" \
              && echo "41e9c565594c390622cf968d82fa4135d9e9a11d06c1515644288cbc844e3380  $TMP/ffmpeg.tar.xz" | sha256sum -c -; then
              OK=1
              break
            fi
            echo "::warning::ffmpeg download/verify attempt $attempt/3 failed"
            ls -l "$TMP/ffmpeg.tar.xz" || true
            head -c 400 "$TMP/ffmpeg.tar.xz" | od -c | head -12 || true
            sleep $((attempt * 3))
          done
          if [ "$OK" != "1" ]; then
            echo "::error::ffmpeg static build failed to download and verify after 3 attempts"
            exit 1
          fi
          mkdir -p "$DEST"
          tar -xJf "$TMP/ffmpeg.tar.xz" -C "$TMP"
          install -m 0755 "$TMP"/ffmpeg-n8.1.3-27-g8dca1586f4-linux64-gpl-8.1/bin/ffmpeg "$TMP"/ffmpeg-n8.1.3-27-g8dca1586f4-linux64-gpl-8.1/bin/ffprobe "$DEST/"
          rm -rf "$TMP"
        fi
        echo "$DEST" >> "$GITHUB_PATH"

    - name: Verify ffmpeg
      shell: bash
      run: |
        ffmpeg -version
        ffprobe -version | head -1
