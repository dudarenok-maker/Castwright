org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# KGP escape hatch (ops-17 / #790): these two flags keep Flutter's built-in
# Kotlin OFF so the still-unmigrated KGP plugins (flutter_foreground_task,
# mobile_scanner) keep building under AGP 9. audio_session dropped off this
# list at 0.2.4 (confirmed built-in-Kotlin-clean). Do NOT delete until the
# remaining plugins ship built-in-Kotlin releases — app.yml asserts both are
# present and that the Flutter pin stays in lockstep with app-deps-watch.yml.
#
# Verified 2026-08-05 at flutter_foreground_task 10.0.0 + mobile_scanner 7.4.0
# (Flutter 3.44.1, AGP 9.0.1). `flutter build apk --release` still warns and
# still names BOTH plugins — but only ONE of them is actually a blocker:
#
#   flutter_foreground_task 10.0.0 — android/build.gradle:25 is a bare
#     `apply plugin: 'kotlin-android'`. Unconditional. THIS is why the flags
#     below must stay. (Its android/ and lib/ trees are byte-identical to
#     9.2.2; 10.0.0 is an iOS-only release plus an SDK-floor bump.)
#   mobile_scanner 7.4.0 — already migrated. Since 7.2.1 it applies KGP only
#     when built-in Kotlin is NOT active, and 7.3.0 extended that to read
#     `android.builtInKotlin` directly. It appears in the warning *because we
#     set that flag to false right here*; upstream's own comment names this
#     exact configuration. It will drop off the warning by itself once the
#     flags can go — no further mobile_scanner bump is needed for ops-17.
#
# So the warning's plugin list is NOT a migration oracle: for any plugin that
# applies KGP conditionally, this hatch guarantees it stays named no matter
# what upstream did. Read the plugin's own android/build.gradle in the pub
# cache instead. Deleting the flags to get a clean reading does not work
# either — the Flutter migrator silently rewrites them back into this file
# during the next build.
android.newDsl=false
android.builtInKotlin=false
