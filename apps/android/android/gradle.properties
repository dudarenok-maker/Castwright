org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# KGP escape hatch (ops-17 / #790): kept. Do NOT delete these two flags just
# because the plugins migrated -- Flutter's migrator re-adds them (see below).
#
# Verified 2026-11-24 at flutter_foreground_task 11.0.3 + mobile_scanner 7.5.0
# (pubspec.lock; Flutter 3.44.1, AGP 9.0.1) -- OUTCOME NOT CLEARED. Plugin
# side is clean: flutter_foreground_task 11.0.3 android/build.gradle no longer
# applies kotlin-android, audio_session 0.2.4 applies it only when agpMajor<9,
# and mobile_scanner applies it only when built-in Kotlin is inactive.
# Experiment: with both flags deleted, `flutter build apk --release` printed
# "Upgrading gradle.properties" twice before the Gradle task, built the APK
# (EXIT=0, 85.2MB, no "apply Kotlin Gradle Plugin" warning), and afterwards
# gradle.properties again held `android.builtInKotlin=false` and
# `android.newDsl=false` ("added automatically by Flutter migrator"). Flutter's
# DisableNewDslMigration (flutter_tools) re-adds them whenever absent, so
# removal cannot be made to stick on this Flutter pin; it is not a plugin
# blocker. `flutter build appbundle --release` also EXIT=0. app.yml still
# asserts both flags are present and the Flutter pin lockstep.
android.newDsl=false
android.builtInKotlin=false
