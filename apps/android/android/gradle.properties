org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# KGP escape hatch (ops-17 / #790): kept. Do NOT delete or flip these two flags;
# Flutter 3.44.1's own Gradle plugin needs them (see below).
#
# Verified 2026-11-24 at flutter_foreground_task 11.0.3 + mobile_scanner 7.5.0
# (pubspec.lock; Flutter 3.44.1, AGP 9.0.1) -- OUTCOME NOT CLEARED. Plugin
# side is clean: flutter_foreground_task 11.0.3 android/build.gradle no longer
# applies kotlin-android, audio_session 0.2.4 applies it only when agpMajor<9,
# and mobile_scanner applies it only when built-in Kotlin is inactive. The
# blocker is the Flutter pin, not a plugin: with each flag set to `true` in a
# scratch copy, `flutter build apk --debug` fails.
#  - android.builtInKotlin=true: Flutter's Gradle plugin applies `kotlin-android`
#    to every plugin subproject, so app_links fails ("The
#    'org.jetbrains.kotlin.android' plugin is no longer required ... AGP 9").
#  - android.newDsl=true: the Flutter Gradle plugin NPEs (it reads the legacy
#    BaseExtension).
# Flutter's migrators only add a flag that is ABSENT (builtInKotlin by
# DisableBuiltInKotlinMigration, newDsl by DisableNewDslMigration), so a build
# with both flags deleted silently ran with them restored to false; that build
# says nothing about a flag-free build. The absence of the "apply Kotlin Gradle
# Plugin" warning is NOT a migration oracle (its detector only matches
# `plugins { id(...) }`). #790 clears only on a Flutter release whose Gradle
# plugin stops reading the legacy DSL and stops force-applying KGP. app.yml
# still asserts both flags are present and the Flutter pin lockstep.
android.newDsl=false
android.builtInKotlin=false
